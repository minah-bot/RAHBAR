# Documents the SHAPE of the Secret. Values are placeholders. This file is NOT listed in
# kustomization.yaml: applying it would overwrite the real Secret. Create the real one with
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# (base64 is encoding, not encryption: never commit a real value.)
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
