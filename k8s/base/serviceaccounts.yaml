# One ServiceAccount per workload, none of them able to talk to the API server (section 4.7).
# automountServiceAccountToken is also false on every pod spec: belt and braces.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer, namespace: rahbar}
automountServiceAccountToken: false
