# Laptop / minikube. Images are built locally and loaded with `make images` (minikube image load).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: rahbar-api, newTag: dev}
  - {name: rahbar-ui, newTag: dev}
  - {name: rahbar-indexer, newTag: dev}
