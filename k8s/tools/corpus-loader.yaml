# A throwaway pod that mounts the corpus PVC so `make corpus-load` can kubectl-cp files into it.
# Not part of the app: not in any kustomization, and deleted straight after the copy.
apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - {name: corpus, mountPath: /corpus}
  volumes:
    - name: corpus
      persistentVolumeClaim: {claimName: corpus}
